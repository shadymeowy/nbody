<!doctype html>
<html lang="en-us">

<head>
    <meta charset="utf-8">
    <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Drawing3D GL</title>
    <style>
        html,
        body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: black;
        }

        canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: block;
            border: 0;
            outline: none;
            touch-action: none;
        }

        #loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            font-family: sans-serif;
            font-weight: bold;
        }
    </style>
</head>

<body>
    <div id="loading">Loading...</div>
    <canvas id="canvas" oncontextmenu="event.preventDefault()" tabindex="-1"></canvas>

    <script type='text/javascript'>
        var canvasElement = document.getElementById('canvas');
        var loadingElement = document.getElementById('loading');

        // parse url query parameters
        const params = new URLSearchParams(window.location.search);

        // convert query parameters to command line arguments
        function queryToArgs() {
            const args = [];

            for (const [rawKey, rawVal] of params.entries()) {
                const key = rawKey.startsWith("-") ? rawKey : `--${rawKey}`;

                if (rawVal === "") {
                    args.push(key);
                } else {
                    args.push(key, rawVal);
                }
            }
            return args;
        }

        // get msgpack_input so we can preload it
        var msgpackInput = params.get("msgpack_input");
        var hasMsgpackInput = msgpackInput !== null && msgpackInput !== "";
        // csv_input
        var csvInput = params.get("csv_input");
        var hasCsvInput = csvInput !== null && csvInput !== "";

        var Module = {
            canvas: canvasElement,
            print: (text) => console.log(text),
            printErr: (text) => console.error(text),
            arguments: queryToArgs(),
            preRun: [
                () => {
                    Module.setStatus('Downloading dataset...');

                    if (hasMsgpackInput) {
                        FS.createPreloadedFile(
                            '/',
                            msgpackInput,
                            msgpackInput,
                            true,
                            false,
                            () => {
                                console.log(`Preloaded ${filename} from ${url}`);
                            },
                            (err) => {
                                console.error(`Failed to preload ${filename} from ${url}: ${err}`);
                            }
                        );
                    }

                    if (hasCsvInput) {
                        FS.createPreloadedFile(
                            '/',
                            csvInput,
                            csvInput,
                            true,
                            false,
                            () => {
                                console.log(`Preloaded ${filename} from ${url}`);
                            },
                            (err) => {
                                console.error(`Failed to preload ${filename} from ${url}: ${err}`);
                            }
                        );
                    }
                }
            ],
            onRuntimeInitialized: () => {
                loadingElement.style.display = 'none';
                canvasElement.focus();
            },
            setStatus: (text) => {
                if (text === "Running...") loadingElement.style.display = 'none';
                else loadingElement.innerText = text;
            }
        };
        window.onerror = (event) => {
            loadingElement.style.display = 'block';
            loadingElement.innerText = 'Error: Check Console';
        };
    </script>

</body>

</html>
